name: V2 Deterministic Format Remediation

on:
  push:
    branches:
      - remediation-v2
    paths:
      - ".github/workflows/v2-format.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: remediation-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply repository formatter
        run: bun run format
      - name: Commit formatting-only remediation
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: normalize generated baseline formatting [skip format]"
          git push origin HEAD:remediation-v2
