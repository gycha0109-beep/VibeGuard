name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIBEGUARD_SYNTHETIC_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/static-security-audit.mjs
      - run: node scripts/security-before-after.mjs
      - run: node scripts/performance-before-after.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/

  supabase-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.119.0
      - name: Start disposable Supabase stack and apply migrations
        run: supabase start
      - name: Run live local RLS/AuthZ/Storage/analytics/concurrency verification
        run: bash scripts/run-supabase-db-tests.sh
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

  release-tag:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: close VibeGuard hardened portfolio'
    needs: [verify, supabase-policy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create immutable hardened release marker
        shell: bash
        run: |
          existing="$(git ls-remote --tags origin refs/tags/hardened-release | awk '{print $1}')"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "hardened-release already points to this commit"
              exit 0
            fi
            echo "hardened-release already exists on a different commit" >&2
            exit 1
          fi
          git tag hardened-release "$GITHUB_SHA"
          git push origin refs/tags/hardened-release
