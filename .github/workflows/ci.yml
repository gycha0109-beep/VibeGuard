name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIBEGUARD_SYNTHETIC_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/static-security-audit.mjs
      - run: node scripts/security-before-after.mjs
      - run: node scripts/performance-before-after.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: package-lock.json

  supabase-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3.0.1
        with:
          version: 2.119.0
      - name: Start disposable Supabase stack and apply migrations
        run: supabase start
      - name: Run live local RLS/AuthZ/Storage/concurrency verification
        run: bash scripts/run-supabase-db-tests.sh
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup
