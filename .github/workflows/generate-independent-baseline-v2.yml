name: Generate Independent Baseline V2

on:
  push:
    branches:
      - baseline-v2-generation
    paths:
      - ".github/workflows/generate-independent-baseline-v2.yml"
      - "provenance/client-brief.md"
      - "provenance/generation-prompt.md"
      - "provenance/generate-baseline.mjs"

permissions:
  contents: write
  models: read

concurrency:
  group: baseline-v2-generation
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated generation branch
        uses: actions/checkout@v7
        with:
          ref: baseline-v2-generation
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Verify branch does not contain hardened VibeGuard source
        run: |
          test ! -e docs/04-security-remediation.md
          test ! -e supabase/migrations/202610020002_hardening.sql
          test ! -e tests/security/baseline-contract.test.ts

      - name: Generate baseline with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node provenance/generate-baseline.mjs

      - name: Functional-only install gate
        run: npm install --no-audit --no-fund

      - name: Functional-only production build gate
        run: npm run build

      - name: Freeze generated baseline
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "baseline-v2: freeze independent AI-generated candidate [run ${RUN_ID}]"
          git tag -f baseline-v2-generated
          git push origin HEAD:baseline-v2-generation
          git push origin -f baseline-v2-generated
